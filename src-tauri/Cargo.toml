[package]
name = "excalidraw-local"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-dialog = "2"
trash = "5"

[profile.release]
strip = true
lto = true
opt-level = "s"
